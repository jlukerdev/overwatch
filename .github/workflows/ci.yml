# Lint, format, typecheck + build and unit tests on every pull request and every push to main.
# The e2e smoke test (tests/e2e) is left out: it needs a display (xvfb) on Linux.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # `build` runs the typecheck first.
      - run: npm run build
      - run: npm test
